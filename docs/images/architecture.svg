<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <rect width="960" height="640" fill="#0f1419"/>
  <text x="480" y="36" text-anchor="middle" fill="#e7ecf1" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="600">Sovereign Reduction Algebra — Architecture</text>
  <text x="480" y="58" text-anchor="middle" fill="#8b9aab" font-family="DejaVu Sans, sans-serif" font-size="12">SUBLEQ bi-encoder · extended integers · SHA-512 DAG seal</text>

  <!-- Python launcher -->
  <rect x="320" y="80" width="320" height="56" rx="8" fill="#1a2332" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="480" y="104" text-anchor="middle" fill="#cfe3ff" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600">Python launcher</text>
  <text x="480" y="122" text-anchor="middle" fill="#8b9aab" font-family="DejaVu Sans, sans-serif" font-size="11">scripts/run_biencoder.py · compare printed integers</text>

  <!-- arrows down -->
  <line x1="400" y1="136" x2="240" y2="180" stroke="#4a90d9" stroke-width="1.5"/>
  <line x1="560" y1="136" x2="720" y2="180" stroke="#4a90d9" stroke-width="1.5"/>

  <!-- J box -->
  <rect x="80" y="180" width="320" height="120" rx="8" fill="#1a2332" stroke="#5cb87a" stroke-width="1.5"/>
  <text x="240" y="206" text-anchor="middle" fill="#b8f0c8" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">J 9.7</text>
  <text x="240" y="228" text-anchor="middle" fill="#8b9aab" font-family="DejaVu Sans, sans-serif" font-size="11">j/biencoder.ijs · +/ .*</text>
  <text x="240" y="246" text-anchor="middle" fill="#8b9aab" font-family="DejaVu Sans, sans-serif" font-size="11">j/sha512.ijs · uint32 halves</text>
  <text x="240" y="264" text-anchor="middle" fill="#8b9aab" font-family="DejaVu Sans, sans-serif" font-size="11">extended integers · 6!:2 benches</text>
  <text x="240" y="282" text-anchor="middle" fill="#6a7a8a" font-family="DejaVu Sans, sans-serif" font-size="10">production arithmetic</text>

  <!-- R box -->
  <rect x="560" y="180" width="320" height="120" rx="8" fill="#1a2332" stroke="#d9a34a" stroke-width="1.5"/>
  <text x="720" y="206" text-anchor="middle" fill="#f0d9b8" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600">R 4.5 + gmp bigz</text>
  <text x="720" y="228" text-anchor="middle" fill="#8b9aab" font-family="DejaVu Sans, sans-serif" font-size="11">r/biencoder.R · %*% on bigz</text>
  <text x="720" y="246" text-anchor="middle" fill="#8b9aab" font-family="DejaVu Sans, sans-serif" font-size="11">r/sha512.R · uint16 limbs</text>
  <text x="720" y="264" text-anchor="middle" fill="#8b9aab" font-family="DejaVu Sans, sans-serif" font-size="11">extended integers · system.time</text>
  <text x="720" y="282" text-anchor="middle" fill="#6a7a8a" font-family="DejaVu Sans, sans-serif" font-size="10">production arithmetic</text>

  <!-- pipeline -->
  <rect x="80" y="340" width="800" height="72" rx="8" fill="#1a2332" stroke="#7a8a9a" stroke-width="1.5"/>
  <text x="480" y="366" text-anchor="middle" fill="#e7ecf1" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600">SUBLEQ attention pipeline (not softmax)</text>
  <text x="480" y="388" text-anchor="middle" fill="#8b9aab" font-family="DejaVu Sans, sans-serif" font-size="12">ARRAY → SUBTRACT → COMPARE → PREDICATE → SELECT → ROUTE → REDUCE → STATE</text>
  <text x="480" y="404" text-anchor="middle" fill="#6a7a8a" font-family="DejaVu Sans, sans-serif" font-size="10">weights = fixed permutation · unmasked head = exact A×B · routed max abs error reported separately</text>

  <!-- seal DAG -->
  <rect x="80" y="440" width="800" height="150" rx="8" fill="#1a2332" stroke="#9b6bdb" stroke-width="1.5"/>
  <text x="480" y="466" text-anchor="middle" fill="#e0d0f5" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600">SHA-512 DAG seal</text>
  <!-- nodes -->
  <rect x="120" y="486" width="140" height="40" rx="6" fill="#241a32" stroke="#9b6bdb"/>
  <text x="190" y="510" text-anchor="middle" fill="#e0d0f5" font-family="DejaVu Sans, sans-serif" font-size="11">exact_head</text>
  <rect x="300" y="486" width="140" height="40" rx="6" fill="#241a32" stroke="#9b6bdb"/>
  <text x="370" y="510" text-anchor="middle" fill="#e0d0f5" font-family="DejaVu Sans, sans-serif" font-size="11">predicted</text>
  <rect x="480" y="486" width="140" height="40" rx="6" fill="#241a32" stroke="#9b6bdb"/>
  <text x="550" y="510" text-anchor="middle" fill="#e0d0f5" font-family="DejaVu Sans, sans-serif" font-size="11">weights</text>
  <rect x="660" y="486" width="140" height="40" rx="6" fill="#241a32" stroke="#9b6bdb"/>
  <text x="730" y="510" text-anchor="middle" fill="#e0d0f5" font-family="DejaVu Sans, sans-serif" font-size="11">prime (p)</text>
  <line x1="190" y1="526" x2="480" y2="560" stroke="#9b6bdb" stroke-width="1"/>
  <line x1="370" y1="526" x2="480" y2="560" stroke="#9b6bdb" stroke-width="1"/>
  <line x1="550" y1="526" x2="480" y2="560" stroke="#9b6bdb" stroke-width="1"/>
  <line x1="730" y1="526" x2="480" y2="560" stroke="#9b6bdb" stroke-width="1"/>
  <rect x="360" y="560" width="240" height="22" rx="4" fill="#241a32" stroke="#9b6bdb"/>
  <text x="480" y="575" text-anchor="middle" fill="#e0d0f5" font-family="DejaVu Sans, sans-serif" font-size="11">parent = SHA-512(SRADAG01 ‖ child digests)</text>

  <!-- legacy note -->
  <text x="480" y="620" text-anchor="middle" fill="#6a7a8a" font-family="DejaVu Sans, sans-serif" font-size="11">Legacy: TinyAPL (Complex Double cannot hold Goldilocks p) · Astra APL sources included under astra/</text>
</svg>
